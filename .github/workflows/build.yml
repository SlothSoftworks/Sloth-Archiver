name: Build

# Two ways in:
#   - Push to master (i.e. a PR just got merged) -- only master's HEAD
#     actually moving triggers this, not commits on the PR's own branch
#     while it's still open. Whether this actually builds anything depends
#     on whether package.json's version was bumped in that merge (see the
#     "plan" job below): no bump means the whole build job is skipped
#     entirely, so a merge that doesn't touch the version costs nothing
#     beyond the cheap plan job itself. A version bump builds and releases
#     for real.
#   - A version tag pushed directly (e.g. v0.25.0) -- same real
#     build+release path, for cutting/re-cutting a release without going
#     through a merge:
#       git tag v0.25.0 && git push origin v0.25.0
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
    # Skips a build entirely when a push only touches docs/meta files -- e.g.
    # a README tweak has no reason to spend a full build. Applies to both
    # the branches and tags triggers above (GitHub
    # doesn't support scoping path filters to just one of them within a
    # single `push:` block); in practice this only matters for the branches
    # path, since a real release tag always accompanies a package.json
    # version bump, which this filter doesn't touch.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

# Guards against two overlapping runs for the same ref (a manual re-run
# while one's still in flight, or two pushes landing close together) --
# cancels the older run's still-running jobs in favor of the newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Required so the plan job's tag push and the build job's release upload
# can both write using the workflow's own GITHUB_TOKEN -- needs "Read and
# write permissions" enabled under Settings > Actions > General > Workflow
# permissions for that default token to actually have this scope, in
# addition to declaring it here.
permissions:
  contents: write

jobs:
  # Cheap, Node/Python-free, runs on Linux regardless of what's actually
  # being built -- figures out whether this run should build anything at
  # all, and under which tag, before any real (expensive) work starts. Also
  # owns creating the tag and the draft release itself exactly once, so the
  # build job's per-platform runs never race each other trying to create
  # the same release object (the failure mode a single-job version of this
  # workflow hit earlier: two nearly simultaneous "does this release exist
  # yet" checks both saying no).
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan this run
        id: plan
        shell: bash
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A tag push already names its own release -- nothing to decide.
            TAG="${{ github.ref_name }}"
            SHOULD_RELEASE=true
          else
            # A master push only becomes a release if this commit's
            # package.json version isn't tagged yet (i.e. this merge bumped
            # it). Deliberately does NOT push the tag and rely on that
            # re-triggering the tag path above: a tag pushed with the
            # default GITHUB_TOKEN from inside a workflow run does not
            # trigger further workflow runs (GitHub's own loop-prevention),
            # so the release has to happen in this same run instead.
            VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
              SHOULD_RELEASE=false
              echo "$TAG already exists -- this merge didn't bump the version, skipping the build entirely."
            else
              SHOULD_RELEASE=true
              echo "$TAG is new -- this merge bumped the version, will build and release."
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Guards against a mistagged or stray release: a directly pushed tag
      # (unlike one this workflow creates itself off master -- see "Tag
      # this commit" below) could in principle name a version that doesn't
      # match package.json, or point at a commit that never actually
      # landed on master. Skipped on the branch-push path since that tag
      # is constructed from package.json itself, on the very commit this
      # job is running on -- there's nothing to verify.
      - name: Verify tag matches package.json and points at master
        if: github.ref_type == 'tag' && steps.plan.outputs.should_release == 'true'
        shell: bash
        run: |
          set -e
          PACKAGE_VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          if [ "${{ steps.plan.outputs.version }}" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ${{ steps.plan.outputs.tag }} (version ${{ steps.plan.outputs.version }}) does not match package.json's version ($PACKAGE_VERSION)."
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          TAG_COMMIT=$(git rev-list -n 1 "${{ steps.plan.outputs.tag }}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
            echo "::error::Tag ${{ steps.plan.outputs.tag }} must point at a commit reachable from origin/master."
            exit 1
          fi

      - name: Tag this commit
        if: github.ref_type == 'branch' && steps.plan.outputs.should_release == 'true'
        run: |
          git tag ${{ steps.plan.outputs.tag }}
          git push origin ${{ steps.plan.outputs.tag }}

      # Deletes any existing release for this exact tag before creating a
      # fresh one, same reasoning as the old single-job workflow: makes
      # this idempotent regardless of what a prior interrupted run left
      # behind. Created empty (no assets) here -- each platform in the
      # build job below uploads its own assets afterward with `gh release
      # upload`, not `create`, so they can't race each other the way
      # multiple parallel `create` calls would.
      #
      # The release notes are hand-assembled instead of using
      # `--generate-notes` on its own, so that anyone landing on the
      # release page directly (not via the README) still gets a per-OS
      # download table, matching the one in the README's own Download
      # section. Asset filenames are computed here rather than read back
      # from the (not-yet-uploaded) assets themselves -- GitHub sanitizes
      # spaces in uploaded filenames to dots, and that rule is applied by
      # hand below to match.
      - name: Create draft release
        if: steps.plan.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.plan.outputs.tag }}" --yes --repo "${{ github.repository }}" || echo "No existing release -- nothing to clean up."

          TAG="${{ steps.plan.outputs.tag }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"

          # Built as an array of complete lines (rather than one big
          # multi-line string) so no accidental leading whitespace ends up
          # in the markdown -- 4+ leading spaces on a line would make
          # GitHub render it as a code block instead of a table row.
          ROWS=(
            "| Platform | Link |"
            "|---|---|"
            "| Windows (installer) | [Download]($BASE_URL/SlothArchiver.Setup.$VERSION.exe) |"
            "| Windows (portable, no install) | [Download]($BASE_URL/SlothArchiver.$VERSION.exe) |"
            "| macOS (Apple Silicon) | [Download]($BASE_URL/SlothArchiver-$VERSION-arm64.dmg) |"
            "| macOS (Intel) | [Download]($BASE_URL/SlothArchiver-$VERSION.dmg) |"
            "| Linux (AppImage) | [Download]($BASE_URL/SlothArchiver-$VERSION.AppImage) |"
          )
          ASSET_TABLE=$(printf '%s\n' "${ROWS[@]}")

          # Same content `--generate-notes` alone would have produced --
          # fetched separately here so it can be appended after the per-OS
          # table above instead of being the whole release body. Falls back
          # to empty (rather than failing the step) if the API call doesn't
          # return anything, e.g. on a repo's very first release.
          AUTO_NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f "tag_name=$TAG" --jq .body 2>/dev/null || echo "")

          # Pulls this release's own section out of CHANGELOG.md so the
          # hand-written "what's actually new" text shows up on the release
          # page itself, not just in the repo. Stops at the next version
          # heading rather than the next "## " of any kind, so a nested
          # subheading inside one release's own entry doesn't truncate it
          # early. Missing on purpose is expected before CHANGELOG.md has
          # ever been updated for a version -- degrades to just the
          # download table + auto-generated notes rather than failing the
          # release.
          MANUAL_NOTES=$(awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { capture = 1; next }
            capture && /^## \[/ { capture = 0 }
            capture { print }
          ' CHANGELOG.md 2>/dev/null || echo "")
          if [ -z "$(echo "$MANUAL_NOTES" | tr -d '[:space:]')" ]; then
            echo "::warning::No CHANGELOG.md section found for $VERSION -- release notes will skip the changelog section."
            MANUAL_NOTES=""
          fi

          {
            echo "## Downloads"
            echo
            echo "$ASSET_TABLE"
            echo
            echo "All builds are unsigned -- see the README's [Installing](https://github.com/${{ github.repository }}#installing) section for the first-run security warning on each OS."
            if [ -n "$MANUAL_NOTES" ]; then
              echo
              echo "## What's new"
              echo
              echo "$MANUAL_NOTES"
            fi
            if [ -n "$AUTO_NOTES" ]; then
              echo
              echo "$AUTO_NOTES"
            fi
          } > release-notes.md

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --draft \
            --notes-file release-notes.md

  build:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    strategy:
      # One platform's build failing shouldn't cancel the others -- each
      # produces an independent installer for an independent OS/arch.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS (Apple Silicon)
          # macos-13 was fully retired by GitHub on 2025-12-04 -- a job
          # requesting it never fails outright, it just sits unschedulable
          # forever (this is what "the Intel mac job is hung" turned out to
          # be). macos-15-intel is GitHub's current dedicated label for an
          # Intel-architecture runner.
          - os: macos-15-intel
            label: macOS (Intel)
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Build only -- this step no longer publishes anything itself. It does
      # make one read-only network call now (build:ytdlp:bin fetches and
      # GPG-verifies yt-dlp's own signed release asset from GitHub, see
      # scripts/fetch-ytdlp-bin.mjs), but that's an idempotent GET against an
      # already-published release, unrelated to the actual risk this
      # separation guards against: electron-builder's own `--publish` flow
      # has internal retry behavior around *creating/uploading* a release,
      # and a retry there (e.g. after a transient network hiccup) has been
      # the suspected cause of a single run ending up with duplicate release
      # state before. Publishing is done explicitly below instead, as plain
      # `gh` calls this workflow fully controls.
      - name: Build
        run: npm run dist

      # Uploads whatever this platform actually produced -- Windows makes
      # an nsis installer + its blockmap + a portable exe, mac makes a dmg,
      # Linux makes an AppImage. One combined glob covering every possible
      # extension (rather than per-OS branching) keeps this step reusable
      # across all four matrix entries as-is; the existence check discards
      # whichever patterns didn't match on this particular platform (an
      # unmatched glob expands to its own literal, unquoted, string, which
      # -e correctly treats as "not a real file").
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=()
          for f in dist/*.exe dist/*.exe.blockmap dist/*.dmg dist/*.AppImage; do
            [ -e "$f" ] && ASSETS+=("$f")
          done
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No build artifacts found in dist/ -- nothing to upload." >&2
            exit 1
          fi
          gh release upload "${{ needs.plan.outputs.tag }}" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber

  # Runs once, after every platform has uploaded its own installer assets,
  # rather than per-platform -- otherwise two matrix entries could both try
  # to publish their own partial SHA256SUMS at the same time (the same kind
  # of race the two-job split above exists to avoid for release creation).
  checksums:
    needs: [plan, build]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir artifacts
          gh release download "${{ needs.plan.outputs.tag }}" --repo "${{ github.repository }}" --dir artifacts
          # Drop any SHA256SUMS from a prior run of this same release before
          # hashing, so a re-run never ends up hashing last run's checksums
          # file into this run's checksums file.
          rm -f artifacts/SHA256SUMS
          (cd artifacts && sha256sum -- * > ../SHA256SUMS)
          gh release upload "${{ needs.plan.outputs.tag }}" SHA256SUMS --repo "${{ github.repository }}" --clobber
