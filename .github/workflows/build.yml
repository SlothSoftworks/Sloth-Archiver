name: Build

# Two ways in:
#   - Push to master (i.e. a PR just got merged) -- only master's HEAD
#     actually moving triggers this, not commits on the PR's own branch
#     while it's still open. Whether this actually builds anything depends
#     on whether package.json's version was bumped in that merge (see
#     "Determine release tag" below, the very first real step): no bump
#     means the job exits immediately after that check, before Node/Python
#     setup or any dependency install, so a merge that doesn't touch the
#     version costs nothing. A version bump builds and releases for real.
#   - A version tag pushed directly (e.g. v0.24.0) -- same real
#     build+release path, for cutting/re-cutting a release without going
#     through a merge:
#       git tag v0.24.0 && git push origin v0.24.0
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
    # Skips a build entirely when a push only touches docs/meta files -- e.g.
    # a futureSpecs.md edit or a README tweak has no reason to spend a full
    # Windows build. Applies to both the branches and tags triggers above
    # (GitHub doesn't support scoping path filters to just one of them
    # within a single `push:` block); in practice this only matters for the
    # branches path, since a real release tag always accompanies a
    # package.json version bump, which this filter doesn't touch.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

# Guards against two overlapping runs for the same ref (a manual re-run
# while one's still in flight, or two pushes landing close together) both
# racing to publish -- electron-builder's GitHub publish only reuses an
# existing release if it can already see one, so two runs starting close
# enough together can each create their own separate draft release instead
# of one being reused, with the .exe/.exe.blockmap split across them
# depending on which run got further before finishing/being interrupted.
# Cancelling the older run in favor of the newer one prevents that outright.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Required so electron-builder's GitHub publish step can create/update a
# release and upload artifacts using the workflow's own GITHUB_TOKEN --
# needs "Read and write permissions" enabled under Settings > Actions >
# General > Workflow permissions for that default token to actually have
# this scope, in addition to declaring it here.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform's build failing shouldn't cancel the other -- each
      # produces an independent installer for an independent OS.
      fail-fast: false
      matrix:
        os: [windows-latest]
        # macOS commented out for now -- macOS runners cost 10x the Linux
        # minutes multiplier, and this is still being iterated on. Re-add
        # once the workflow itself is confirmed working via Windows.
        # os: [macos-latest, windows-latest]
        # Linux commented out for now to save CI minutes -- also needs a
        # "linux" target added to package.json's build config (only "mac"
        # and "win" exist today) before this would actually work.
        # os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-tags isn't needed here -- the version-bump check below
          # queries the remote directly (git ls-remote), not local history.
          fetch-depth: 0

      # The very first real step, deliberately before Node/Python setup or
      # any dependency install: a master push whose package.json version
      # isn't new bails out right here, so a merge that doesn't bump the
      # version costs nothing beyond a checkout. Uses grep/sed instead of
      # `node -p require(...)` specifically so this check doesn't need Node
      # set up yet -- setup-node happens further down, gated on this step's
      # own result.
      #
      # A tag push already names its own release -- nothing to decide here.
      # Note this deliberately does NOT push the tag and rely on that
      # re-triggering the tag path above: a tag pushed with the default
      # GITHUB_TOKEN from inside a workflow run does not trigger further
      # workflow runs (GitHub's own loop-prevention), so the release has to
      # happen in this same run instead.
      - name: Determine release tag
        if: github.ref_type == 'branch'
        id: release_check
        shell: bash
        run: |
          VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists -- this merge didn't bump the version, skipping the build entirely."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is new -- this merge bumped the version, will build and release."
          fi

      - uses: actions/setup-node@v4
        if: github.ref_type == 'tag' || steps.release_check.outputs.should_release == 'true'
        with:
          node-version: 24
          cache: npm

      # build-ytdlp-bin.mjs freezes yt-dlp into a standalone binary via a
      # local venv + PyInstaller -- needs a real Python on PATH on every
      # platform, not just whatever the runner image happens to ship.
      - uses: actions/setup-python@v5
        if: github.ref_type == 'tag' || steps.release_check.outputs.should_release == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/python/requirements-build.txt

      - run: npm ci
        if: github.ref_type == 'tag' || steps.release_check.outputs.should_release == 'true'

      - name: Tag this commit
        if: github.ref_type == 'branch' && steps.release_check.outputs.should_release == 'true'
        run: |
          git tag ${{ steps.release_check.outputs.tag }}
          git push origin ${{ steps.release_check.outputs.tag }}

      - name: Determine this run's release tag
        if: github.ref_type == 'tag' || steps.release_check.outputs.should_release == 'true'
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ steps.release_check.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # cancel-in-progress (above) kills an older run's process, but doesn't
      # undo anything it already did via the GitHub API before being killed
      # -- if that run got as far as creating a draft release and uploading
      # one asset before being cut off, that orphaned draft is still there.
      # Deleting any existing release for this exact tag first makes each
      # run start from a clean slate regardless of what a prior interrupted
      # run left behind. `gh` is preinstalled on GitHub-hosted runners.
      # Doesn't touch the git tag itself (only removes the Release object).
      - name: Remove any stray release for this tag
        if: github.ref_type == 'tag' || steps.release_check.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ steps.release_tag.outputs.tag }}" --yes --repo "${{ github.repository }}" || echo "No existing release -- nothing to clean up."

      # Build only -- no network/GitHub calls happen during this step, it's
      # purely local packaging. Deliberately NOT `npm run dist:publish`:
      # electron-builder's own GitHub publisher has its own internal
      # retry behavior around creating the release, and a retry there (e.g.
      # after a transient network hiccup) has been the suspected cause of a
      # single run ending up with two release objects instead of one --
      # the failure mode this whole flow exists to prevent. Publishing is
      # instead done explicitly below, as one plain `gh` call this workflow
      # fully controls: no hidden retries, no way to silently duplicate.
      - name: Build
        if: github.ref_type == 'tag' || steps.release_check.outputs.should_release == 'true'
        run: npm run dist

      # Explicit, single-shot release creation + asset upload. The app has
      # no electron-updater/auto-update feature, so the .exe.blockmap
      # electron-builder's nsis target generates alongside the installer
      # (for differential updates) isn't functionally needed by anything --
      # uploaded anyway, when present, since it's free/harmless, not
      # because it's used. Included conditionally rather than as a second
      # literal glob: whether a non-publishing build still computes the
      # blockmap (it's an update-flow artifact, so it may only get
      # generated when a publish is actually requested) isn't confirmed --
      # an unmatched literal glob would otherwise fail `gh` outright.
      - name: Publish release
        if: github.ref_type == 'tag' || steps.release_check.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(dist/*.exe)
          if compgen -G "dist/*.exe.blockmap" > /dev/null; then
            ASSETS+=(dist/*.exe.blockmap)
          fi
          gh release create "${{ steps.release_tag.outputs.tag }}" \
            "${ASSETS[@]}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.release_tag.outputs.tag }}" \
            --draft \
            --generate-notes

  # linux: still needs a "linux" target added to package.json's build config
  # (only "mac"/"win" exist today) and the same release-tag/build/publish
  # steps as the windows-latest job above (not sketched out here since
  # they'd just be a copy of it) before this would actually produce
  # anything.
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #         cache: npm
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.11'
  #         cache: pip
  #         cache-dependency-path: src/python/requirements-build.txt
  #     - run: npm ci
